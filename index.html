<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quadro da Família</title>
<meta name="description" content="Calendário, lembretes, tarefas, rotinas e almoços da família, num só sítio.">
<meta name="theme-color" content="#1F6B5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quadro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Sora:wght@300;600;700&family=Manrope:wght@400;500;700&family=Baloo+2:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/style.css?v=16">
<script src="config.js"></script>
<script type="module" src="js/backend.js?v=16"></script>
<script src="js/app.js?v=16" defer></script>
</head>
<body>
<div id="login" class="login" hidden>
  <div class="login-card">
    <svg class="login-mark" viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="8" width="40" height="34" rx="7" fill="none" stroke="currentColor" stroke-width="3"/><path d="M4 18h40M15 4v8M33 4v8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="28" r="3" fill="currentColor"/><circle cx="24" cy="28" r="3" fill="currentColor"/><circle cx="32" cy="28" r="3" fill="currentColor"/></svg>
    <h1>Quadro da Família</h1>
    <p class="muted">Calendário, lembretes, tarefas, rotinas e almoços da família, num só sítio.</p>
    <button id="loginBtn" class="addbtn login-btn" type="button">Entrar com Google</button>
    <p id="loginMsg" class="small muted" role="status"></p>
    <button id="loginOut" class="ghost" type="button" hidden>Entrar com outra conta</button>
  </div>
</div>
<div class="wrap">
  <header class="top">
    <div style="flex:1;min-width:0">
      <div class="date" id="todayLabel"></div>
      <h1>Quadro da Família</h1>
    </div>
    <button class="iconbtn" id="btnGoogle" aria-label="O meu Google Calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M15 15.2a3 3 0 1 1-.9-2.2M15 15.2h-2.5"/></svg></button>
    <button class="iconbtn" id="btnWall" aria-label="Modo ecrã de parede"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M9 20.5h6M12 16.5v4"/></svg></button>
    <button class="iconbtn" id="btnFamily" aria-label="Editar família"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17.5" cy="9" r="2.4"/><path d="M16 14.2c2.6-.3 4.6 1.3 5 4.3"/></svg></button>
  </header>
  <div class="who" id="who" role="toolbar" aria-label="Ver por pessoa"></div>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="Secções"><div class="in" id="tabs"></div></nav>
<div id="wall" hidden></div>
<div id="overlay"></div>


</body>
</html>
